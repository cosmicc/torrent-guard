<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="title description">
  <title id="title">Torrent Guard dark-compatible log palette</title>
  <desc id="description">Green success, bright cyan activity, yellow waiting or warnings, red errors or rejections, purple dry run. Light and dark reference samples. Terminal themes determine exact ANSI colors.</desc>
  <rect width="880" height="370" fill="#e5e7eb"/>
  <g font-family="monospace" font-size="16">
    <rect x="20" y="20" width="410" height="300" rx="8" fill="#ffffff"/>
    <rect x="450" y="20" width="410" height="300" rx="8" fill="#111827"/>
    <text x="40" y="55" fill="#111827">Dark-compatible palette · light reference</text>
    <text x="470" y="55" fill="#f9fafb">Dark-compatible palette · dark reference</text>
    <g fill="#16803c"><rect x="40" y="80" width="20" height="20"/><text x="75" y="96">ACCEPT / CLEANED — success</text></g>
    <g fill="#0891b2"><rect x="40" y="125" width="20" height="20"/><text x="75" y="141">HEARTBEAT — activity</text></g>
    <g fill="#a16207"><rect x="40" y="170" width="20" height="20"/><text x="75" y="186">WAIT / PENDING — warnings</text></g>
    <g fill="#dc2626"><rect x="40" y="215" width="20" height="20"/><text x="75" y="231">ERROR / REJECT — attention</text></g>
    <g fill="#9333ea"><rect x="40" y="260" width="20" height="20"/><text x="75" y="276">DRY RUN — report only</text></g>
    <g fill="#4ade80"><rect x="470" y="80" width="20" height="20"/><text x="505" y="96">ACCEPT / CLEANED — success</text></g>
    <g fill="#67e8f9"><rect x="470" y="125" width="20" height="20"/><text x="505" y="141">HEARTBEAT — activity</text></g>
    <g fill="#facc15"><rect x="470" y="170" width="20" height="20"/><text x="505" y="186">WAIT / PENDING — warnings</text></g>
    <g fill="#f87171"><rect x="470" y="215" width="20" height="20"/><text x="505" y="231">ERROR / REJECT — attention</text></g>
    <g fill="#c084fc"><rect x="470" y="260" width="20" height="20"/><text x="505" y="276">DRY RUN — report only</text></g>
    <text x="20" y="350" fill="#374151">ANSI 92 / 96 / 93 / 91 / 95 · exact colors follow your terminal theme.</text>
  </g>
</svg>
