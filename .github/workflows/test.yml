name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m py_compile guard.py deletion.py records.py orphans.py maintenance.py status_report.py status_web.py scripts/release_notes.py scripts/watch_logs.py scripts/maintenance_install.py scripts/install_maintenance_omv.py scripts/install_maintenance_docker.py
      - name: Validate release metadata
        # Host utilities are not installed into the non-root Guard runtime.
        run: |
          python -m py_compile scripts/maintenance_uninstall.py scripts/uninstall_maintenance_omv.py scripts/uninstall_maintenance_docker.py
          python scripts/release_notes.py > /dev/null
