name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m py_compile guard.py deletion.py scripts/release_notes.py
      - name: Validate release metadata
        run: python scripts/release_notes.py > /dev/null
