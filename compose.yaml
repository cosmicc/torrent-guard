name: torrent-guard
services:
  torrent-guard:
    build:
      context: .
    image: torrent-guard:2.1
    # Match the host download owner's numeric IDs; remain non-root.
    user: "${GUARD_UID:-1000}:${GUARD_GID:-1000}"
    container_name: torrent-guard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    # For a remote Nginx server, bind a private host IP and allow only that
    # proxy in STATUS_ALLOWED_CLIENTS plus the host firewall. See INSTALL.md.
    ports:
      - "${STATUS_BIND_ADDRESS:-127.0.0.1}:${STATUS_HOST_PORT:-8088}:${STATUS_PORT:-8080}"
    # Access host-published qBittorrent/Sonarr/Radarr API ports on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent SQLite cleanup journal and rotating logs on the Docker host.
      # Before first startup: sudo install -d -o 1000 -g 1000 -m 750 /config/torrent-guard
      # Use GUARD_UID/GUARD_GID instead if customized; see INSTALL.md for migration.
      - /config/torrent-guard:/state
      # Read-only, for ffprobe video verification. No deletion via this mount.
      # Mount PARENT containing both complete/ and incomplete/.
      # Never bind only complete/: file paths are relative to QBIT_DOWNLOAD_ROOT.
      - ${DOWNLOADS_HOST_PATH:?Set DOWNLOADS_HOST_PATH in .env to qBittorrent download directory}:/downloads:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    pids_limit: 48
    mem_limit: 256m
    # Status is read-only; no Docker socket or write access to downloads.
