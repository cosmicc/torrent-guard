name: torrent-guard
services:
  torrent-guard:
    build:
      context: .
    image: torrent-guard:0.9
    container_name: torrent-guard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    # Access host-published qBittorrent/Sonarr/Radarr API ports on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent SQLite cleanup journal and rotating logs on the Docker host.
      # Before first startup: sudo install -d -o 65534 -g 65534 -m 750 /config/torrent-guard
      - /config/torrent-guard:/state
      # Read-only, for ffprobe video verification. No deletion via this mount.
      # Mount PARENT containing both complete/ and incomplete/.
      # Never bind only complete/: file paths are relative to QBIT_DOWNLOAD_ROOT.
      - ${DOWNLOADS_HOST_PATH:?Set DOWNLOADS_HOST_PATH in .env to qBittorrent download directory}:/downloads:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    pids_limit: 48
    mem_limit: 256m
    # No inbound listening ports, Docker socket or write access to downloads.
